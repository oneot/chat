<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School AI Assistant</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(
        135deg,
        #0f172a 0%,
        #1e3a8a 35%,
        #2563eb 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 1600px;
      height: calc(100vh - 40px);

      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.15);

      border-radius: 24px;
      overflow: hidden;

      box-shadow:
        0 10px 30px rgba(0,0,0,0.25),
        0 0 50px rgba(37,99,235,0.25);
    }

    .header {
      height: 72px;
      background: rgba(255,255,255,0.08);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 24px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 12px;

      background: linear-gradient(
        135deg,
        #60a5fa,
        #2563eb
      );

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 18px;
      font-weight: 700;
    }

    .title {
      color: white;
    }

    .title h1 {
      font-size: 18px;
      font-weight: 600;
    }

    .title p {
      font-size: 13px;
      opacity: .75;
    }

    .iframe-wrapper {
      height: calc(100% - 72px);
      background: white;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .status {
      color: rgba(255,255,255,0.7);
      font-size: 13px;
    }

    @media (max-width:768px) {
      body {
        padding: 0;
      }

      .container {
        height: 100vh;
        border-radius: 0;
      }

      .header {
        padding: 0 16px;
      }

      .title h1 {
        font-size: 16px;
      }

      .title p {
        display: none;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div class="brand">
        <div class="logo">AI</div>

        <div class="title">
          <h1>School AI Assistant</h1>
          <p>Powered by Microsoft Copilot Studio</p>
        </div>
      </div>

      <div class="status">
        ● Online
      </div>
    </div>

    <div class="iframe-wrapper">
      <iframe
        src="https://copilotstudio.microsoft.com/environments/Default-2d4925a0-fa86-4da1-94fe-d7887f35d993/bots/cre09_schoolai-orchestrator_n=2&enableFileAttachment=false&cliAgent=true
      </iframe>
    </div>

  </div>

</body>
</html>
