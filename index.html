<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School AI Assistant</title>

https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    background:
        radial-gradient(circle at top left,#2563eb 0%,transparent 30%),
        radial-gradient(circle at bottom right,#7c3aed 0%,transparent 30%),
        linear-gradient(135deg,#0f172a,#111827);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
}

.chat-container{
    width:100%;
    max-width:1400px;
    height:92vh;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.15);
    border-radius:24px;

    overflow:hidden;

    box-shadow:
        0 20px 60px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.12);
}

.header{
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;

    background:rgba(255,255,255,.05);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.left{
    display:flex;
    align-items:center;
    gap:16px;
}

.logo{
    width:44px;
    height:44px;
    border-radius:12px;

    background:linear-gradient(135deg,#2563eb,#7c3aed);

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;
    font-size:20px;
    font-weight:700;
}

.title{
    color:white;
}

.title h1{
    font-size:18px;
    font-weight:600;
}

.title p{
    font-size:13px;
    color:rgba(255,255,255,.7);
    margin-top:2px;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    color:white;
    font-size:14px;
}

.dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#22c55e;
    box-shadow:0 0 12px #22c55e;
}

.chat-frame{
    height:calc(100% - 76px);
}

.chat-frame iframe{
    width:100%;
    height:100%;
    border:none;
    background:white;
}

@media(max-width:768px){

    .chat-container{
        height:100vh;
        border-radius:0;
    }

    body{
        padding:0;
    }

    .title h1{
        font-size:16px;
    }

    .title p{
        display:none;
    }
}
</style>
</head>

<body>

<div class="chat-container">

    <div class="header">

        <div class="left">

            <div class="logo">AI</div>

            <div class="title">
                <h1>School AI Assistant</h1>
                <p>Powered by Microsoft Copilot Studio</p>
            </div>

        </div>

        <div class="status">
            <div class="dot"></div>
            Online
        </div>

    </div>

    <div class="chat-frame">
        <iframe
            src="https://copilotstudio.microsoft.com/environments/Default-2d4925a0-fa86-4da1-94fe-d7887f35d993/bots/cre09_schoolai-orchestrator_EK2Uf9/webchat?__version__=2&enableFileAttachment=false&cliAgent=true"
            allow="microphone">
        </iframe>
    </div>

</div>

</body>
</html>
