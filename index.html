<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>School AI Orchestrator</title>

<link href="https://fonts.googleapis.com=Inter:wght@300;400;500;600;700&display=swap

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter',sans-serif;
    height:100vh;
    overflow:hidden;
    background:#050816;
    color:white;
}

.bg{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at 20% 20%,#2F80ED55,transparent 35%),
    radial-gradient(circle at 80% 30%,#7F5AF055,transparent 35%),
    radial-gradient(circle at 50% 80%,#00C6FF33,transparent 40%),
    #050816;
    animation:move 12s infinite alternate ease-in-out;
}

@keyframes move{
    from{
        filter:hue-rotate(0deg);
    }
    to{
        filter:hue-rotate(50deg);
    }
}

.app{
    position:relative;
    z-index:2;
    height:100vh;
    display:flex;
    flex-direction:column;
    padding:20px;
}

.header{
    height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;

    backdrop-filter:blur(18px);
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);

    border-radius:20px;
    padding:0 24px;

    box-shadow:
    0 8px 32px rgba(0,0,0,.3);
}

.logo{
    display:flex;
    align-items:center;
    gap:14px;
}

.icon{
    width:46px;
    height:46px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
    135deg,
    #3B82F6,
    #8B5CF6
    );
    font-size:22px;
}

.title{
    display:flex;
    flex-direction:column;
}

.title h1{
    font-size:18px;
    font-weight:600;
}

.title span{
    font-size:12px;
    color:#A0AEC0;
}

.badge{
    padding:8px 14px;
    border-radius:999px;
    background:#10B98122;
    border:1px solid #10B98166;
    color:#34D399;
    font-size:12px;
}

.chat-container{
    flex:1;
    margin-top:20px;

    backdrop-filter:blur(18px);
    background:rgba(255,255,255,0.05);

    border:1px solid rgba(255,255,255,0.1);

    border-radius:24px;

    overflow:hidden;

    box-shadow:
    0 10px 40px rgba(0,0,0,.4);
}

iframe{
    width:100%;
    height:100%;
    border:none;
    background:white;
}

@media(max-width:768px){

    .title span{
        display:none;
    }

    .header{
        padding:0 16px;
    }

    .badge{
        display:none;
    }
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="app">

    <div class="header">

        <div class="logo">

            <div class="icon">
                🤖
            </div>

            <div class="title">
                <h1>School AI Orchestrator</h1>
                <span>Powered by Microsoft Copilot Studio</span>
            </div>

        </div>

        <div class="badge">
            AI Ready
        </div>

    </div>

    <div class="chat-container">

        <iframe
        src="https://copilotstudio.microsoft.com/environments/Default-2d4925a0-fa86-4da1-94fe-d7887f35d993/bots/cre09_schoolai-orchestrator_EK2Uf9/webchat?__version__=2&enableFileAttachment=false&cliAgent=true">
        </iframe>

    </div>

</div>

</body>
</html>
